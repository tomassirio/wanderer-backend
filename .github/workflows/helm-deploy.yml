name: Helm Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (dev, staging, production)'
        required: true
        type: string
      image-tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: false
        type: string
      service:
        description: 'Service to deploy (empty for all)'
        required: false
        type: string
        default: ''
    secrets:
      TWINGATE_SERVICE_KEY:
        description: 'Twingate service key for cluster access'
        required: true
      KUBECONFIG_CONTENT:
        description: 'Base64 encoded kubeconfig file'
        required: true
      DB_PASSWORD:
        description: 'Password for wanderer database user'
        required: true
      DB_AUTH_PASSWORD:
        description: 'Password for wanderer_auth database user'
        required: true
      POSTGRES_PASSWORD:
        description: 'PostgreSQL superuser password'
        required: true
      JWT_SECRET:
        description: 'JWT signing secret'
        required: true
      GOOGLE_MAPS_API_KEY:
        description: 'Google Maps API key for distance calculation'
        required: false
      EMAIL_PASSWORD:
        description: 'SMTP password for Brevo email service'
        required: false
      GOOGLE_CLIENT_SECRET:
        description: 'Google OAuth client secret for SSO (wanderer-auth)'
        required: false
      RELEASE_CI_TOKEN:
        description: 'Shared secret CI sends as X-Release-Token to create release-notes drafts (wanderer-command)'
        required: false

env:
  ENV_SUFFIX: ${{ inputs.environment == 'dev' && '-dev' || '' }}
  ENVIRONMENT: ${{ inputs.environment }}
  IMAGE_TAG: ${{ inputs.image-tag }}
  NAMESPACE: ${{ inputs.namespace }}

jobs:
  # PostgreSQL and the services deploy as parallel jobs. They all start together, so on a
  # protected environment (prod) they wait for review at the same time and one approval of
  # the environment releases all of them.
  deploy-postgres:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Setup Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy PostgreSQL
        env:
          PVC_NAME: postgres${{ env.ENV_SUFFIX }}-pvc
          STATEFULSET_NAME: postgres${{ env.ENV_SUFFIX }}
        run: |
          # Handle PVC change if StatefulSet exists
          if kubectl get statefulset $STATEFULSET_NAME -n ${{ inputs.namespace }} &>/dev/null; then
            CURRENT_PVC=$(kubectl get statefulset $STATEFULSET_NAME -n ${{ inputs.namespace }} -o jsonpath='{.spec.template.spec.volumes[?(@.name=="postgres-storage")].persistentVolumeClaim.claimName}')
            if [ "$CURRENT_PVC" != "$PVC_NAME" ]; then
              echo "PVC changed, recreating StatefulSet..."
              kubectl delete statefulset $STATEFULSET_NAME -n ${{ inputs.namespace }} --cascade=orphan
              kubectl delete pod ${STATEFULSET_NAME}-0 -n ${{ inputs.namespace }} --force --grace-period=0 || true
            fi
          fi
          
          helm upgrade --install postgres ./commons/src/main/chart \
            --namespace ${{ inputs.namespace }} \
            --create-namespace \
            --set environment.name="${{ inputs.environment }}" \
            --set environment.suffix="${{ env.ENV_SUFFIX }}" \
            --set postgres.password="${{ secrets.POSTGRES_PASSWORD }}" \
            --set postgres.userPassword="${{ secrets.DB_PASSWORD }}" \
            --set postgres.authPassword="${{ secrets.DB_AUTH_PASSWORD }}" \
            --set persistence.existingClaim="$PVC_NAME" \
            --wait --timeout 5m
          
          echo "✓ PostgreSQL deployed successfully"

  deploy-service:
    name: deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      # Independent: one service failing doesn't cancel the others.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.service == '' && '["wanderer-auth","wanderer-command","wanderer-query"]' || format('["{0}"]', inputs.service)) }}
    env:
      # Each service only gets its own secrets.
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DB_PASSWORD: ${{ matrix.service == 'wanderer-auth' && secrets.DB_AUTH_PASSWORD || secrets.DB_PASSWORD }}
      EMAIL_SMTP_PWD: ${{ matrix.service == 'wanderer-auth' && secrets.EMAIL_PASSWORD || '' }}
      GOOGLE_CLIENT_SECRET: ${{ matrix.service == 'wanderer-auth' && secrets.GOOGLE_CLIENT_SECRET || '' }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      SSO_ALLOWED_RETURN_URIS: ${{ vars.SSO_ALLOWED_RETURN_URIS }}
      BOOTSTRAP_ADMIN_USERNAME: ${{ vars.BOOTSTRAP_ADMIN_USERNAME }}
      BOOTSTRAP_ADMIN_ENABLED: ${{ vars.BOOTSTRAP_ADMIN_ENABLED }}
      EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
      EMAIL_BASE_URL: ${{ vars.EMAIL_BASE_URL }}
      GOOGLE_MAPS_API_KEY: ${{ matrix.service == 'wanderer-command' && secrets.GOOGLE_MAPS_API_KEY || '' }}
      RELEASE_CI_TOKEN: ${{ matrix.service == 'wanderer-command' && secrets.RELEASE_CI_TOKEN || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Setup Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy ${{ matrix.service }}
        run: .github/scripts/deploy-service.sh "${{ matrix.service }}"

  verify-deployment:
    needs: [deploy-postgres, deploy-service]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Setup Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify deployment
        run: |
          echo "=== Deployments ==="
          kubectl get deployments,statefulsets -n ${{ inputs.namespace }}
          echo -e "\n=== Pods ==="
          kubectl get pods -n ${{ inputs.namespace }}
          echo -e "\n=== Services ==="
          kubectl get services -n ${{ inputs.namespace }}


