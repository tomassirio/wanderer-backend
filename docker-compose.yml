x-common-variables: &common-db-variables
  SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres-cqrs}:${DB_PORT:-5432}/${DB_NAME:-wanderer_db}
  SPRING_DATASOURCE_USERNAME: ${DB_USER:-wanderer}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
  DB_URL: jdbc:postgresql://${DB_HOST:-postgres-cqrs}:${DB_PORT:-5432}/${DB_NAME:-wanderer_db}
  DB_USERNAME: ${DB_USER:-wanderer}
  DB_PASSWORD: ${DB_PASSWORD:-password}

x-service-common: &service-common
  restart: unless-stopped

services:
  postgres-cqrs:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: wanderer-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-wanderer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-wanderer_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wanderer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: wanderer-auth-postgres
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-wanderer_auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-password}
      POSTGRES_DB: ${AUTH_DB_NAME:-wanderer_auth_db}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-wanderer_auth}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: wanderer-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  wanderer-command:
    <<: *service-common
    depends_on:
      postgres-cqrs:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: ${WANDERER_COMMAND_IMAGE:-ghcr.io/tomassirio/wanderer-command:latest}
    container_name: wanderer-command
    ports:
      - "${WANDERER_COMMAND_PORT:-8081}:8081"
    environment:
      <<: *common-db-variables
      # Allow overriding the CORS allowed origins via env var APP_CORS_ALLOWED_ORIGINS
      # Defaults to http://localhost:51538 when the variable is not provided.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:51538}
      REDIS_HOST: ${REDIS_HOST:-redis}
      # Required for the app context to boot at all (GeoApiContextConfig fails without it) —
      # set in a local .env file (gitignored), never commit a real key here.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

  wanderer-query:
    <<: *service-common
    depends_on:
      postgres-cqrs:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: ${WANDERER_QUERY_IMAGE:-ghcr.io/tomassirio/wanderer-query:latest}
    container_name: wanderer-query
    ports:
      - "${WANDERER_QUERY_PORT:-8082}:8082"
    environment:
      <<: *common-db-variables
      # Allow overriding the CORS allowed origins via env var APP_CORS_ALLOWED_ORIGINS
      # Defaults to http://localhost:51538 when the variable is not provided.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:51538}
      REDIS_HOST: ${REDIS_HOST:-redis}

  wanderer-auth:
    <<: *service-common
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: ${WANDERER_AUTH_IMAGE:-ghcr.io/tomassirio/wanderer-auth:latest}
    container_name: wanderer-auth
    ports:
      - "${WANDERER_AUTH_PORT:-8083}:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-wanderer_auth_db}
      DB_USERNAME: ${AUTH_DB_USER:-wanderer_auth}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-password}
      DB_DRIVERCLASSNAME: org.postgresql.Driver
      # Auth has no REDIS_HOST bridge property of its own (unlike command/query) —
      # it picks up Spring Boot's standard property name directly.
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      JWT_SECRET: ${JWT_SECRET:-0123456789ABCDEF0123456789ABCDEF}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      WANDERER_QUERY_URL: ${WANDERER_QUERY_URL:-http://wanderer-query:8082}
      WANDERER_COMMAND_URL: ${WANDERER_COMMAND_URL:-http://wanderer-command:8081}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:51538}
      # Email Configuration
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-a39a49001@smtp-brevo.com}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-wanderer@tomassir.io}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Wanderer}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:3000}
      EMAIL_AUTH: ${EMAIL_AUTH:-true}
      EMAIL_START_TLS: ${EMAIL_START_TLS:-true}

volumes:
  postgres_data:
  auth_postgres_data:
