databaseChangeLog:
  - changeSet:
      id: 010-normalize-credential-emails
      author: tomassirio
      comment: >
        Normalize stored emails to lowercase/trimmed and enforce case-insensitive
        uniqueness on user_credentials so SSO linking (which normalizes provider
        emails) can never collide with two differently-cased credential rows.
      preConditions:
        - onFail: HALT
        - onFailMessage: >
            Found case-duplicate emails in user_credentials (e.g. ana@x.com and
            Ana@X.com both exist). This migration refuses to merge accounts
            automatically: manually resolve the duplicates first (merge or
            delete one of each pair), then re-run the migration.
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT COUNT(*) FROM (
                SELECT lower(email) FROM user_credentials GROUP BY lower(email) HAVING COUNT(*) > 1
              ) d
      changes:
        - sql:
            sql: UPDATE user_credentials SET email = lower(trim(email))
        - sql:
            sql: UPDATE email_verification_tokens SET email = lower(trim(email))
        - sql:
            sql: UPDATE user_identities SET email = lower(trim(email)) WHERE email IS NOT NULL
        - sql:
            sql: CREATE UNIQUE INDEX uq_user_credentials_email_lower ON user_credentials (lower(email))
      rollback:
        # Lowercasing emails is not reversible (original casing is lost); rollback only
        # drops the unique index.
        - sql:
            sql: DROP INDEX IF EXISTS uq_user_credentials_email_lower
